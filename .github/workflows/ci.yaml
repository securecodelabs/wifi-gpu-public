name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  complexity:
    name: Recovery complexity
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned complexity checker
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-complexity.txt
      - name: Check recovery complexity
        run: python scripts/check-complexity.py
  security:
    name: Security
    uses: ./.github/workflows/security.yaml # zizmor: ignore[self-repository] -- Same-commit reusable workflow; actionlint 1.7.12 does not support $/ yet.
    with:
      ref: ${{ inputs.ref || github.ref }}
  native:
    name: Native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libvulkan1 mesa-vulkan-drivers
      - name: Configure Linux with software Vulkan coverage
        if: runner.os == 'Linux'
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DWIFI_GPU_TEST_SOFTWARE_VULKAN=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build-ci -A x64
      - name: Build with compiler warnings as errors
        run: cmake --build build-ci --config Release --parallel 2
      - name: CPU, lifecycle, recovery and available software Vulkan tests
        run: ctest --test-dir build-ci -C Release --output-on-failure -LE gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ctest-${{ matrix.os }}
          path: build-ci/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
  sanitizer:
    name: Sanitizer
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev cmake libssl-dev
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - run: cmake --build build-sanitize --parallel 2
      - run: ctest --test-dir build-sanitize --output-on-failure -LE gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sanitizer-tests
          path: build-sanitize/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
